spring.application.name=api-gateway

server.port=8080


# Customer Service
spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/customers/**


# Event Service
spring.cloud.gateway.routes[1].id=event-service
spring.cloud.gateway.routes[1].uri=lb://EVENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/events/**


# Venue Service
spring.cloud.gateway.routes[2].id=venue-service
spring.cloud.gateway.routes[2].uri=lb://VENUE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/venues/**


management.endpoints.web.exposure.include=health,info,metrics
