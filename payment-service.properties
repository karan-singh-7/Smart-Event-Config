server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/paymentdb
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Resillience4j configuration
resilience4j.circuitbreaker.instances.bookingService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=5
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingService.permitted-number-of-calls-in-half-open-state=2
